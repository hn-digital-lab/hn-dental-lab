<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HN Dental Lab</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --blue:#2F63D8;
  --blue-dark:#204FAF;
  --navy:#182638;
  --text:#243447;
  --muted:#718096;
  --bg:#F3F6FA;
  --card:#FFFFFF;
  --border:#DCE4EE;
  --soft:#EAF1FB;
  --green:#3A9B72;
  --orange:#E5A23C;
  --red:#D95757;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* ================= LOGO ================= */

.logo{
  display:flex;
  align-items:center;
  gap:12px;
  user-select:none;
}

.logo-mark{
  font-size:38px;
  font-weight:900;
  letter-spacing:-4px;
  color:#111827;
  line-height:1;
}

.logo-text{
  border-left:2px solid #1F2937;
  padding-left:12px;
}

.logo-main{
  font-size:25px;
  font-weight:800;
  color:#111827;
}

.logo-sub{
  font-size:10px;
  letter-spacing:4px;
  color:#596579;
  margin-top:4px;
}

/* ================= AUTH ================= */

.auth-page{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:30px 16px;
  background:
    radial-gradient(circle at top left,#E8F0FC 0,#F3F6FA 38%,#EEF2F7 100%);
}

.auth-card{
  width:100%;
  max-width:570px;
  background:white;
  border:1px solid var(--border);
  border-radius:28px;
  padding:42px;
  box-shadow:0 25px 70px rgba(36,52,71,.12);
}

.auth-logo{
  justify-content:center;
  margin-bottom:38px;
}

.portal-tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  background:#EDF2F8;
  border-radius:18px;
  padding:5px;
  margin-bottom:34px;
}

.portal-tab{
  border:0;
  background:transparent;
  padding:15px;
  border-radius:14px;
  color:#66758B;
  font-weight:700;
  font-size:17px;
}

.portal-tab.active{
  background:white;
  color:var(--blue);
  box-shadow:0 7px 20px rgba(36,52,71,.09);
}

.auth-title{
  font-size:42px;
  margin-bottom:8px;
  color:#182638;
}

.auth-subtitle{
  color:#708099;
  font-size:18px;
  margin-bottom:30px;
}

.form-group{
  margin-bottom:19px;
}

.form-label{
  display:block;
  font-weight:700;
  margin-bottom:8px;
  color:#243447;
}

.form-input,
.form-select,
.form-textarea{
  width:100%;
  border:2px solid #DCE4EE;
  background:#fff;
  border-radius:15px;
  padding:15px 16px;
  outline:none;
  color:#243447;
  transition:.2s;
}

.form-input:focus,
.form-select:focus,
.form-textarea:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 4px rgba(47,99,216,.10);
}

.form-textarea{
  min-height:120px;
  resize:vertical;
}

.primary-btn{
  width:100%;
  border:0;
  border-radius:15px;
  padding:16px;
  background:var(--blue);
  color:white;
  font-weight:800;
  font-size:17px;
  box-shadow:0 10px 24px rgba(47,99,216,.22);
  transition:.2s;
}

.primary-btn:hover{
  background:var(--blue-dark);
  transform:translateY(-1px);
}

.secondary-btn{
  border:2px solid var(--border);
  background:white;
  color:var(--text);
  border-radius:15px;
  padding:14px 20px;
  font-weight:700;
}

.forgot{
  display:block;
  text-align:right;
  margin:-3px 0 20px;
  color:var(--blue);
  font-weight:700;
  cursor:pointer;
}

.switch-auth{
  text-align:center;
  color:#718096;
  margin-top:22px;
}

.switch-auth span{
  color:var(--blue);
  font-weight:800;
  cursor:pointer;
}

/* ================= APP ================= */

.app{
  min-height:100vh;
}

.topbar{
  height:76px;
  background:white;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
  position:sticky;
  top:0;
  z-index:50;
}

.topbar-logo .logo-mark{
  font-size:30px;
}

.topbar-logo .logo-main{
  font-size:20px;
}

.topbar-logo .logo-sub{
  font-size:8px;
}

.top-actions{
  display:flex;
  align-items:center;
  gap:12px;
}

.icon-btn{
  width:44px;
  height:44px;
  border:1px solid var(--border);
  background:white;
  border-radius:13px;
  position:relative;
  font-size:20px;
}

.notification-dot{
  position:absolute;
  top:7px;
  right:7px;
  width:9px;
  height:9px;
  background:#3478E5;
  border:2px solid white;
  border-radius:50%;
}

.profile-btn{
  display:flex;
  align-items:center;
  gap:9px;
  border:1px solid var(--border);
  background:white;
  border-radius:14px;
  padding:6px 12px 6px 6px;
}

.avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  background:#DDE8FA;
  color:var(--blue);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

.layout{
  display:flex;
  min-height:calc(100vh - 76px);
}

.sidebar{
  width:245px;
  background:#fff;
  border-right:1px solid var(--border);
  padding:25px 16px;
}

.nav-title{
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:1.5px;
  color:#94A0B1;
  padding:0 12px;
  margin:10px 0;
}

.nav-item{
  width:100%;
  border:0;
  background:transparent;
  color:#65748A;
  text-align:left;
  padding:13px 14px;
  border-radius:12px;
  margin-bottom:5px;
  font-weight:700;
}

.nav-item:hover,
.nav-item.active{
  background:#EAF1FB;
  color:var(--blue);
}

.main{
  flex:1;
  padding:32px;
  min-width:0;
}

.page-heading{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-bottom:26px;
}

.page-heading h1{
  font-size:31px;
}

.page-heading p{
  color:var(--muted);
  margin-top:6px;
}

.add-case-btn{
  border:0;
  background:var(--blue);
  color:white;
  border-radius:13px;
  padding:14px 20px;
  font-weight:800;
  white-space:nowrap;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:17px;
  margin-bottom:25px;
}

.stat-card{
  background:white;
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px;
  box-shadow:0 5px 20px rgba(36,52,71,.04);
}

.stat-label{
  color:#78869A;
  font-size:14px;
  font-weight:700;
}

.stat-value{
  font-size:31px;
  font-weight:900;
  margin-top:9px;
  color:#1D2B3A;
}

/* ================= DOCTOR OVERVIEW ================= */

.dashboard-grid{
  display:grid;
  grid-template-columns:1.1fr 1.9fr;
  gap:20px;
  margin-bottom:25px;
}

.panel{
  background:white;
  border:1px solid var(--border);
  border-radius:20px;
  padding:22px;
  box-shadow:0 5px 20px rgba(36,52,71,.04);
}

.panel-title{
  font-size:19px;
  font-weight:800;
  margin-bottom:20px;
}

.case-chart{
  min-height:270px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:25px;
}

.donut{
  width:170px;
  height:170px;
  border-radius:50%;
  background:conic-gradient(
    #2F63D8 0 32%,
    #4C82E6 32% 54%,
    #6A9AEF 54% 68%,
    #8DB2F5 68% 79%,
    #B9D0F8 79% 100%
  );
  display:flex;
  align-items:center;
  justify-content:center;
}

.donut-center{
  width:105px;
  height:105px;
  border-radius:50%;
  background:white;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.donut-center strong{
  font-size:27px;
}

.donut-center span{
  font-size:12px;
  color:#7B8798;
}

.legend{
  display:flex;
  flex-direction:column;
  gap:11px;
}

.legend-row{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:13px;
}

.legend-dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#2F63D8;
}

/* ================= TABLE ================= */

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:680px;
}

th{
  text-align:left;
  font-size:12px;
  color:#8793A5;
  text-transform:uppercase;
  letter-spacing:.7px;
  padding:13px 12px;
  border-bottom:1px solid var(--border);
}

td{
  padding:17px 12px;
  border-bottom:1px solid #EDF1F5;
  font-size:14px;
}

.case-id{
  font-weight:800;
  color:var(--blue);
}

.status{
  display:inline-flex;
  padding:7px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:800;
}

.status.new{
  background:#E5EEFF;
  color:#2F63D8;
}

.status.seen{
  background:#F0F3F7;
  color:#68788D;
}

.status.progress{
  background:#FFF1D8;
  color:#B87812;
}

.status.completed{
  background:#E4F6ED;
  color:#28835D;
}

.status.sent{
  background:#E8E8F8;
  color:#5B58A4;
}

.view-btn{
  border:0;
  background:#EDF3FF;
  color:var(--blue);
  border-radius:9px;
  padding:8px 12px;
  font-weight:800;
}

/* ================= TEETH ================= */

.arch-box{
  border:1px solid var(--border);
  background:#FBFCFE;
  border-radius:20px;
  padding:25px 15px 30px;
  overflow:hidden;
}

.arch-title{
  text-align:center;
  font-size:18px;
  font-weight:800;
  color:#52637A;
  margin-bottom:10px;
}

.arch{
  width:min(620px,100%);
  height:250px;
  margin:auto;
  position:relative;
}

.tooth{
  position:absolute;
  width:42px;
  height:42px;
  border-radius:50%;
  border:2px solid #C9D3DF;
  background:linear-gradient(145deg,#fff,#E7EDF4);
  box-shadow:
    0 5px 10px rgba(37,52,71,.12),
    inset 0 1px 2px white;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#334155;
  font-weight:800;
  font-size:12px;
  transition:.18s;
  z-index:2;
}

.tooth:hover{
  transform:scale(1.08);
  border-color:var(--blue);
}

.tooth.selected{
  background:#2F63D8;
  border-color:#204FAF;
  color:white;
  box-shadow:0 7px 18px rgba(47,99,216,.30);
}

.work-badge{
  position:absolute;
  bottom:-7px;
  right:-5px;
  min-width:17px;
  height:17px;
  border-radius:50%;
  background:#E5A23C;
  border:2px solid white;
  display:none;
}

.tooth.has-work .work-badge{
  display:block;
}

.tooth-popup{
  position:fixed;
  z-index:1000;
  width:220px;
  background:white;
  border:1px solid var(--border);
  border-radius:15px;
  box-shadow:0 20px 45px rgba(0,0,0,.18);
  padding:10px;
}

.tooth-popup-title{
  font-size:12px;
  color:#7A8798;
  font-weight:700;
  padding:5px 8px 8px;
}

.work-option{
  width:100%;
  border:0;
  background:white;
  text-align:left;
  padding:10px;
  border-radius:9px;
  font-size:13px;
}

.work-option:hover{
  background:#EDF3FF;
  color:var(--blue);
}

/* ================= MODAL ================= */

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(19,31,45,.48);
  z-index:200;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal{
  background:white;
  width:100%;
  max-width:850px;
  max-height:92vh;
  overflow-y:auto;
  border-radius:24px;
  padding:28px;
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:24px;
}

.close-btn{
  width:40px;
  height:40px;
  border:0;
  background:#EEF2F6;
  border-radius:12px;
  font-size:20px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.full{
  grid-column:1/-1;
}

.gender{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.gender label{
  border:2px solid var(--border);
  padding:13px;
  border-radius:13px;
  text-align:center;
  cursor:pointer;
}

.gender input{
  display:none;
}

.gender input:checked + span{
  color:var(--blue);
  font-weight:800;
}

.upload{
  border:2px dashed #B8C9E3;
  background:#F7FAFE;
  border-radius:16px;
  padding:28px;
  text-align:center;
}

.upload strong{
  display:block;
  margin-bottom:7px;
}

.upload small{
  color:#8190A4;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:12px;
  margin-top:25px;
}

.modal-actions .primary-btn{
  width:auto;
  padding:14px 25px;
}

/* ================= PROFILE / NOTIFICATIONS ================= */

.dropdown{
  position:absolute;
  right:25px;
  top:65px;
  width:300px;
  background:white;
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:0 20px 45px rgba(0,0,0,.14);
  padding:12px;
  z-index:80;
}

.notification-item{
  padding:13px;
  border-bottom:1px solid #EDF1F5;
}

.notification-item:last-child{
  border-bottom:0;
}

.profile-card{
  text-align:center;
}

.profile-photo{
  width:90px;
  height:90px;
  border-radius:50%;
  background:#E7EEF9;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:5px auto 15px;
  font-size:30px;
  color:var(--blue);
  font-weight:900;
  overflow:hidden;
}

.profile-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* ================= ADMIN ================= */

.case-unseen{
  background:#F5F9FF;
}

.unseen-dot{
  width:9px;
  height:9px;
  background:#3478E5;
  border-radius:50%;
  display:inline-block;
  margin-right:7px;
}

.case-details{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.detail-box{
  background:#F7F9FC;
  border-radius:14px;
  padding:15px;
}

.detail-box label{
  display:block;
  color:#8491A3;
  font-size:12px;
  margin-bottom:5px;
}

.detail-box strong{
  font-size:15px;
}

.status-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:18px;
}

.status-btn{
  border:1px solid var(--border);
  background:white;
  padding:10px 13px;
  border-radius:10px;
  font-weight:700;
}

.status-btn.active{
  background:var(--blue);
  color:white;
  border-color:var(--blue);
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  right:22px;
  bottom:22px;
  z-index:500;
  background:#182638;
  color:white;
  padding:15px 20px;
  border-radius:14px;
  box-shadow:0 15px 35px rgba(0,0,0,.2);
}

/* ================= MOBILE ================= */

@media(max-width:900px){

  .sidebar{
    display:none;
  }

  .main{
    padding:20px 15px;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .dashboard-grid{
    grid-template-columns:1fr;
  }

  .topbar{
    padding:0 15px;
  }

  .topbar-logo .logo-main{
    font-size:17px;
  }

  .topbar-logo .logo-sub{
    display:none;
  }

  .profile-btn span{
    display:none;
  }

  .page-heading{
    align-items:flex-start;
    flex-direction:column;
  }

  .add-case-btn{
    width:100%;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }
}

@media(max-width:600px){

  .auth-page{
    padding:12px;
    align-items:flex-start;
  }

  .auth-card{
    margin-top:12px;
    padding:25px 18px;
    border-radius:23px;
  }

  .auth-logo .logo-mark{
    font-size:34px;
  }

  .auth-logo .logo-main{
    font-size:21px;
  }

  .auth-title{
    font-size:34px;
  }

  .auth-subtitle{
    font-size:16px;
  }

  .topbar{
    height:68px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .stat-card{
    padding:16px;
  }

  .stat-value{
    font-size:25px;
  }

  .case-chart{
    flex-direction:column;
  }

  .donut{
    width:145px;
    height:145px;
  }

  .arch-box{
    padding:20px 5px 25px;
  }

  .arch{
    height:210px;
    transform:scale(.84);
    transform-origin:center top;
    margin-bottom:-30px;
  }

  .tooth{
    width:37px;
    height:37px;
    font-size:10px;
  }

  .modal-backdrop{
    padding:8px;
    align-items:flex-end;
  }

  .modal{
    max-height:95vh;
    border-radius:22px 22px 0 0;
    padding:20px 15px;
  }

  .modal-actions{
    flex-direction:column-reverse;
  }

  .modal-actions button{
    width:100%!important;
  }

  .case-details{
    grid-template-columns:1fr;
  }

  .toast{
    left:15px;
    right:15px;
    bottom:15px;
    text-align:center;
  }
}
</style>
</head>

<body>

<div id="app"></div>

<script>

/* =========================================================
   DATA
========================================================= */

const ADMIN_EMAIL = "admin@hndentaldigitallab.com";
const ADMIN_PASSWORD = "admin123";

const WORK_TYPES = [
  "Chape",
  "Crown",
  "Crown on Implant",
  "Inlay / Onlay",
  "Bridge 2 Units",
  "Bridge 3 Units",
  "Bridge 4–5 Units",
  "Bridge 6+ Units",
  "Bridge on Implant",
  "Full Arch",
  "Full Arch on Implant",
  "All-on-4",
  "All-on-6",
  "DSD / Smile Design",
  "Digital Mock-up"
];

const UPPER = [
  "18","17","16","15","14","13","12","11",
  "21","22","23","24","25","26","27","28"
];

const LOWER = [
  "48","47","46","45","44","43","42","41",
  "31","32","33","34","35","36","37","38"
];

let users = JSON.parse(localStorage.getItem("hn_users") || "[]");
let cases = JSON.parse(localStorage.getItem("hn_cases") || "[]");
let currentUser = JSON.parse(localStorage.getItem("hn_current_user") || "null");

let activePortal = "doctor";
let activePage = "dashboard";
let selectedTeeth = {};
let selectedTooth = null;
let notificationOpen = false;
let profileOpen = false;


/* =========================================================
   HELPERS
========================================================= */

function save(){
  localStorage.setItem("hn_users",JSON.stringify(users));
  localStorage.setItem("hn_cases",JSON.stringify(cases));
  localStorage.setItem("hn_current_user",JSON.stringify(currentUser));
}

function esc(str=""){
  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

function toast(message){
  const old=document.querySelector(".toast");
  if(old) old.remove();

  const el=document.createElement("div");
  el.className="toast";
  el.textContent=message;
  document.body.appendChild(el);

  setTimeout(()=>el.remove(),2800);
}

function initials(name){
  return (name||"U")
    .split(" ")
    .filter(Boolean)
    .slice(0,2)
    .map(x=>x[0])
    .join("")
    .toUpperCase();
}

function statusClass(status){
  if(status==="New") return "new";
  if(status==="Seen - Not Started") return "seen";
  if(status==="In Progress") return "progress";
  if(status==="Completed") return "completed";
  return "sent";
}

function formatDate(date){
  if(!date) return "-";
  return new Date(date).toLocaleDateString("en-GB");
}

/* =========================================================
   AUTH ACTIONS
========================================================= */

function switchPortal(portal){
  activePortal=portal;
  authPage("login");
}

function doctorSignup(e){
  e.preventDefault();

  const name=document.getElementById("signupName").value.trim();
  const email=document.getElementById("signupEmail").value.trim().toLowerCase();
  const password=document.getElementById("signupPassword").value;
  const confirm=document.getElementById("signupConfirm").value;

  if(password!==confirm){
    toast("Passwords do not match.");
    return;
  }

  if(users.some(u=>u.email===email)){
    toast("This email is already registered.");
    return;
  }

  users.push({
    id:"USR-"+Date.now(),
    name,
    email,
    password,
    photo:"",
    createdAt:new Date().toISOString()
  });

  save();

  toast("Account created successfully.");

  setTimeout(()=>authPage("login"),700);
}

function doctorLogin(e){
  e.preventDefault();

  const identity=document.getElementById("loginIdentity").value.trim().toLowerCase();
  const password=document.getElementById("loginPassword").value;

  const user=users.find(u=>
    (u.email.toLowerCase()===identity ||
     u.name.toLowerCase()===identity) &&
    u.password===password
  );

  if(!user){
    toast("Invalid name/email or password.");
    return;
  }

  currentUser={
    role:"doctor",
    ...user
  };

  save();
  renderDoctor();
}

function adminLogin(e){
  e.preventDefault();

  const identity=document
    .getElementById("adminIdentity")
    .value
    .trim()
    .toLowerCase();

  const password=document
    .getElementById("adminPassword")
    .value;

  if(
    identity===ADMIN_EMAIL.toLowerCase() &&
    password===ADMIN_PASSWORD
  ){
    currentUser={
      role:"admin",
      name:"HN Dental Lab",
      email:ADMIN_EMAIL
    };

    save();
    renderAdmin();
    return;
  }

  toast("Invalid admin login.");
}

function forgotPassword(){

  const email=prompt("Enter your registered email:");

  if(!email) return;

  const user=users.find(
    u=>u.email.toLowerCase()===email.trim().toLowerCase()
  );

  if(user){
    toast("Password recovery instructions would be sent by email.");
  }else{
    toast("No account found with this email.");
  }
}

function forgotAdmin(){
  toast("Admin password recovery will be connected to email in the final backend version.");
}

function logout(){
  currentUser=null;
  localStorage.removeItem("hn_current_user");
  activePortal="doctor";
  authPage("login");
}

function drawArches(){

  drawArch("upperArch",UPPER,true);
  drawArch("lowerArch",LOWER,false);

}

function drawArch(id,teeth,upper){

  const container=document.getElementById(id);

  if(!container) return;

  container.innerHTML="";

  const count=teeth.length;

  teeth.forEach((number,i)=>{

    const tooth=document.createElement("button");

    tooth.type="button";
    tooth.className="tooth";

    if(selectedTeeth[number])
      tooth.classList.add("selected","has-work");

    tooth.innerHTML=`
      ${number}
      <span class="work-badge"></span>
    `;

    /*
      Creates a smooth dental arch.
      This is intentionally calculated instead of using
      a diagonal flex layout, so it stays stable on mobile.
    */

    const x=5+(i/(count-1))*90;

    const center=(count-1)/2;

    const distance=Math.abs(i-center);

    const y=upper
      ? 15 + Math.pow(distance,1.65)*4.1
      : 15 + Math.pow(distance,1.65)*4.1;

    const rotate=(i-center)*3.4;

    tooth.style.left=`${x}%`;
    tooth.style.top=`${Math.min(y,190)}px`;
    tooth.style.transform=`translateX(-50%) rotate(${rotate}deg)`;

    tooth.onclick=(e)=>{
      e.stopPropagation();
      openToothMenu(number,tooth);
    };

    container.appendChild(tooth);
  });
}

function openToothMenu(number,button){

  selectedTooth=number;

  const old=document.querySelector(".tooth-popup");
  if(old) old.remove();

  const popup=document.createElement("div");
  popup.className="tooth-popup";

  popup.innerHTML=`
    <div class="tooth-popup-title">
      Tooth ${number} — Select work
    </div>

    ${WORK_TYPES.map(work=>`

      <button class="work-option"
        onclick="selectToothWork('${number}','${work.replaceAll("'","\\'")}')">
        ${work}
      </button>

    `).join("")}

    <button class="work-option"
      style="color:#D95757"
      onclick="removeTooth('${number}')">
      Remove selection
    </button>
  `;

  document.body.appendChild(popup);

  const rect=button.getBoundingClientRect();

  let left=rect.left;
  let top=rect.bottom+8;

  if(left+220>window.innerWidth-10)
    left=window.innerWidth-230;

  if(top+300>window.innerHeight)
    top=rect.top-310;

  popup.style.left=Math.max(8,left)+"px";
  popup.style.top=Math.max(8,top)+"px";
}

function selectToothWork(number,work){

  selectedTeeth[number]=work;

  closeToothMenu();

  drawArches();
  updateSelectedSummary();
}

function removeTooth(number){

  delete selectedTeeth[number];

  closeToothMenu();

  drawArches();
  updateSelectedSummary();
}

function closeToothMenu(){

  const popup=document.querySelector(".tooth-popup");
  if(popup) popup.remove();
}

document.addEventListener("click",e=>{
  if(!e.target.closest(".tooth") &&
     !e.target.closest(".tooth-popup")){
    closeToothMenu();
  }
});

function updateSelectedSummary(){

  const box=document.getElementById("selectedSummary");

  if(!box) return;

  const entries=Object.entries(selectedTeeth);

  if(!entries.length){
    box.textContent="Click a tooth to select the work.";
    return;
  }

  box.innerHTML=entries.map(([tooth,work])=>`
    <span style="
      display:inline-flex;
      background:#EAF1FB;
      color:#2F63D8;
      padding:7px 10px;
      border-radius:9px;
      margin:3px;
      font-size:12px;
      font-weight:700;">
      ${tooth} · ${esc(work)}
    </span>
  `).join("");
}

function submitCase(e){

  e.preventDefault();

  if(!Object.keys(selectedTeeth).length){
    toast("Please select at least one tooth.");
    return;
  }

  const files=[
    ...document.getElementById("caseFiles").files
  ].map(f=>({
    name:f.name,
    size:f.size,
    type:f.type
  }));

  const newCase={

    id:"HN-"+String(Date.now()).slice(-6),

    doctorId:currentUser.id,

    doctorName:currentUser.name,

    doctorEmail:currentUser.email,

    patient:document.getElementById("patientName").value.trim(),

    gender:
      document.querySelector('input[name="gender"]:checked')?.value || "",

    teeth:{...selectedTeeth},

    work:Object.values(selectedTeeth)[0],

    shade:document.getElementById("shade").value,

    deliveryDate:document.getElementById("deliveryDate").value,

    instructions:document.getElementById("instructions").value.trim(),

    files,

    status:"New",

    createdAt:new Date().toISOString(),

    statusHistory:[
      {
        status:"New",
        date:new Date().toISOString()
      }
    ],

    doctorUnread:false,
    adminUnread:true
  };

  cases.push(newCase);

  save();

  closeModal();

  toast("Case submitted successfully.");

  doctorDashboard();
}


/* =========================================================
   CASE DETAILS
========================================================= */

function openCase(id){

  const c=cases.find(x=>x.id===id);

  if(!c) return;

  if(currentUser.role==="admin"){
    c.adminUnread=false;
  }else{
    c.doctorUnread=false;
  }

  save();

  document.getElementById("overlayArea").innerHTML=`

    <div class="modal-backdrop"
      onclick="if(event.target===this)closeModal()">

      <div class="modal">

        <div class="modal-head">

          <div>
            <h2>Case ${esc(c.id)}</h2>

            <p style="color:#7B8798;margin-top:5px">
              ${formatDate(c.createdAt)}
            </p>
          </div>

          <button class="close-btn"
            onclick="closeModal()">×</button>

        </div>

        <div class="case-details">

          <div class="detail-box">
            <label>Patient</label>
            <strong>${esc(c.patient)}</strong>
          </div>

          <div class="detail-box">
            <label>Gender</label>
            <strong>${esc(c.gender)}</strong>
          </div>

          <div class="detail-box">
            <label>Doctor / Clinic</label>
            <strong>${esc(c.doctorName)}</strong>
          </div>

          <div class="detail-box">
            <label>Email</label>
            <strong>${esc(c.doctorEmail)}</strong>
          </div>

          <div class="detail-box">
            <label>Shade</label>
            <strong>${esc(c.shade||"-")}</strong>
          </div>

          <div class="detail-box">
            <label>Expected Delivery</label>
            <strong>${formatDate(c.deliveryDate)}</strong>
          </div>

          <div class="detail-box" style="grid-column:1/-1">

            <label>Selected Teeth & Work</label>

            <div style="margin-top:7px">

              ${Object.entries(c.teeth||{}).map(([tooth,work])=>`
                <span style="
                  display:inline-flex;
                  background:#EAF1FB;
                  color:#2F63D8;
                  padding:8px 10px;
                  border-radius:9px;
                  margin:3px;
                  font-size:12px;
                  font-weight:700;">
                  Tooth ${tooth}: ${esc(work)}
                </span>
              `).join("")}

            </div>

          </div>

          <div class="detail-box" style="grid-column:1/-1">

            <label>Instructions</label>

            <div style="margin-top:7px">
              ${esc(c.instructions||"No additional instructions.")}
            </div>

          </div>

          <div class="detail-box" style="grid-column:1/-1">

            <label>Uploaded Files</label>

            <div style="margin-top:7px">

              ${
                c.files?.length
                ? c.files.map(f=>`
                    <div style="padding:7px 0">
                      📎 ${esc(f.name)}
                    </div>
                  `).join("")
                : "No files uploaded."
              }

            </div>

          </div>

        </div>

        ${
          currentUser.role==="admin"
          ? `

            <div style="margin-top:25px">

              <strong>Case Status</strong>

              <div class="status-buttons">

                ${[
                  "New",
                  "Seen - Not Started",
                  "In Progress",
                  "Completed",
                  "Sent"
                ].map(status=>`

                  <button
                    class="status-btn ${c.status===status?"active":""}"
                    onclick="changeStatus('${c.id}','${status}')">
                    ${status}
                  </button>

                `).join("")}

              </div>

            </div>

          `
          : ""
        }

        <div style="margin-top:25px">

          <strong>Status History</strong>

          <div style="margin-top:12px">

            ${(c.statusHistory||[]).map(h=>`

              <div style="
                display:flex;
                justify-content:space-between;
                padding:11px 0;
                border-bottom:1px solid #EDF1F5;">

                <span>${esc(h.status)}</span>

                <span style="color:#8290A3;font-size:12px">
                  ${new Date(h.date).toLocaleString()}
                </span>

              </div>

            `).join("")}

          </div>

        </div>

      </div>

    </div>
  `;
}

function changeStatus(id,status){

  const c=cases.find(x=>x.id===id);

  if(!c) return;

  c.status=status;

  c.statusHistory=c.statusHistory||[];

  c.statusHistory.push({
    status,
    date:new Date().toISOString()
  });

  c.doctorUnread=true;

  save();

  openCase(id);

  toast("Status updated.");
}


/* =========================================================
   NOTIFICATIONS
========================================================= */

function toggleNotifications(role){

  notificationOpen=!notificationOpen;

  const old=document.getElementById("notificationDropdown");

  if(old){
    old.remove();
    return;
  }

  const relevant=role==="admin"
    ? cases.filter(c=>c.adminUnread)
    : cases.filter(c=>
        c.doctorId===currentUser.id &&
        c.doctorUnread
      );

  const box=document.createElement("div");

  box.id="notificationDropdown";
  box.className="dropdown";

  box.innerHTML=`

    <strong style="display:block;padding:8px">
      Notifications
    </strong>

    ${
      relevant.length
      ? relevant.slice(-6).reverse().map(c=>`
          <div class="notification-item"
            onclick="openCase('${c.id}')">

            <strong>${esc(c.id)}</strong>

            <div style="color:#718096;margin-top:4px">
              Case status: ${esc(c.status)}
            </div>

          </div>
        `).join("")
      : `
        <div style="
          padding:25px;
          text-align:center;
          color:#8290A3">
          No new notifications.
        </div>
      `
    }

  `;

  document.body.appendChild(box);

  const btn=document.querySelector(".icon-btn");
  const rect=btn.getBoundingClientRect();

  box.style.position="fixed";
  box.style.top=(rect.bottom+8)+"px";
  box.style.right="20px";
}

function toggleProfile(){

  const old=document.getElementById("profileDropdown");

  if(old){
    old.remove();
    return;
  }

  const box=document.createElement("div");

  box.id="profileDropdown";
  box.className="dropdown profile-card";

  box.innerHTML=`

    <div class="profile-photo">
      ${initials(currentUser?.name)}
    </div>

    <h3>${esc(currentUser.name)}</h3>

    <p style="color:#718096;margin:6px 0 20px">
      ${esc(currentUser.email||"")}
    </p>

    <button class="secondary-btn"
      style="width:100%"
      onclick="openProfile()">
      Profile Settings
    </button>

    <button class="secondary-btn"
      style="width:100%;margin-top:8px"
      onclick="logout()">
      Sign Out
    </button>
  `;

  document.body.appendChild(box);

  const btn=document.querySelector(".profile-btn");
  const rect=btn.getBoundingClientRect();

  box.style.position="fixed";
  box.style.top=(rect.bottom+8)+"px";
  box.style.right="20px";
}


/* =========================================================
   PROFILE
========================================================= */

function openProfile(){

  document.querySelectorAll(".dropdown").forEach(x=>x.remove());

  document.getElementById("overlayArea").innerHTML=`

    <div class="modal-backdrop"
      onclick="if(event.target===this)closeModal()">

      <div class="modal" style="max-width:500px">

        <div class="modal-head">

          <h2>Profile</h2>

          <button class="close-btn"
            onclick="closeModal()">×</button>

        </div>

        <div class="profile-card">

          <div class="profile-photo">
            ${initials(currentUser.name)}
          </div>

          <input type="file"
            accept="image/*"
            onchange="changeProfilePhoto(event)">

          <div style="margin-top:25px;text-align:left">

            <div class="form-group">

              <label class="form-label">Name</label>

              <input id="profileName"
                class="form-input"
                value="${esc(currentUser.name)}">

            </div>

            <div class="form-group">

              <label class="form-label">Email</label>

              <input class="form-input"
                value="${esc(currentUser.email)}"
                disabled>

            </div>

          </div>

          <button class="primary-btn"
            onclick="saveProfile()">
            Save Changes
          </button>

        </div>

      </div>

    </div>
  `;
}

function changeProfilePhoto(e){

  const file=e.target.files[0];

  if(!file) return;

  const reader=new FileReader();

  reader.onload=()=>{

    currentUser.photo=reader.result;

    const user=users.find(u=>u.id===currentUser.id);

    if(user) user.photo=reader.result;

    save();

    toast("Profile photo updated.");
  };

  reader.readAsDataURL(file);
}

function saveProfile(){

  const name=document.getElementById("profileName").value.trim();

  if(!name){
    toast("Name cannot be empty.");
    return;
  }

  currentUser.name=name;

  const user=users.find(u=>u.id===currentUser.id);

  if(user) user.name=name;

  save();

  closeModal();

  renderDoctor();

  toast("Profile updated.");
}


/* =========================================================
   MODAL
========================================================= */

function closeModal(){

  document.getElementById("overlayArea").innerHTML="";

  selectedTeeth={};
  selectedTooth=null;

  closeToothMenu();
}


/* =========================================================
   START
========================================================= */

if(currentUser){

  if(currentUser.role==="admin"){
    renderAdmin();
  }else{
    renderDoctor();
  }

}else{

  authPage("login");

}

</script>

</body>
</html>
